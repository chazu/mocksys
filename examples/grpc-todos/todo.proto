syntax = "proto3";

package todo.v1;

import "google/protobuf/empty.proto";

service Todos {
  rpc CreateTodo (CreateTodoRequest) returns (Todo);
  rpc GetTodo (GetTodoRequest) returns (Todo);
  // Changes the fields the request sets and keeps the rest.
  rpc UpdateTodo (Todo) returns (Todo);
  rpc ListTodos (ListTodosRequest) returns (ListTodosResponse);
  rpc DeleteTodo (GetTodoRequest) returns (google.protobuf.Empty);
  // Streams every todo the filter matches, one message each.
  rpc WatchTodos (ListTodosRequest) returns (stream Todo);
  // Counts a batch and reports its first title, without storing anything.
  rpc PreviewImport (stream CreateTodoRequest) returns (ImportPreview);
  // Creates a todo for each request and answers each with the stored todo.
  rpc CreateTodos (stream CreateTodoRequest) returns (stream Todo);
}

message Todo {
  string id = 1;
  string title = 2;
  bool done = 3;
}

message CreateTodoRequest {
  string title = 1;
}

message GetTodoRequest {
  string id = 1;
}

message ListTodosRequest {
  // A SCIM filter over Todo fields, e.g. `done eq true`. Empty lists every todo.
  string filter = 1;
}

message ListTodosResponse {
  repeated Todo todos = 1;
}

message ImportPreview {
  int32 count = 1;
  string first_title = 2;
}
