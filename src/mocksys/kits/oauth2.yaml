# A GitHub- or Codeberg-shaped OAuth2 provider (snooker's mockoauth). The provider's
# paths and default accounts come from the oauth2-provider gene: a kit substitutes
# whole values only, so it cannot build "/{provider}/login/..." itself.
name: oauth2
doc: OAuth2 provider (picker, single-use codes, userinfo)
flags:
  provider: github   # github | codeberg; another name gets /<name>/... paths and GitHub's accounts
  users: { type: json }        # --users FILE.json replaces the provider's default accounts
  token-ttl: { type: number }  # seconds until a token expires on the virtual clock; unset never expires
contract:
  genes:
    - oauth2-provider: { provider: "{provider}", users: "{users}", token-ttl: "{token-ttl}" }
